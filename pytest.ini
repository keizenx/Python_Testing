[pytest]
# ============================================================================
# Configuration pytest avancée - Tests Flask
# ============================================================================

# Découverte automatique des tests
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Verbosité et affichage
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --cov=.
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-fail-under=78
    -p no:cacheprovider

# Marqueurs personnalisés
markers =
    unit: Tests unitaires (fonctions pures)
    integration: Tests d'intégration (routes Flask)
    functional: Tests fonctionnels end-to-end (scénarios complets)
    slow: Tests lents (> 1 seconde)

# Logging détaillé selon les règles (YYYY-MM-DD HH:MM:SS - [LEVEL] - message)
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s - [%(levelname)s] - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests_log.txt
log_file_level = DEBUG
log_file_format = %(asctime)s - [%(levelname)s] - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Options supplémentaires
console_output_style = progress
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Coverage
[coverage:run]
source = .
omit = 
    */tests/*
    */venv/*
    */html5up-paradigm-shift/*
    */static/*
    */templates/*
    setup.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov

